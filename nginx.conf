server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Cabeceras de seguridad (se heredan a los location que no definan add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://images.unsplash.com https://*.unsplash.com; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Proxy opcional same-origin hacia el backend de IA (ADR-18). El archivo lo
    # genera `docker-entrypoint.d/40-runtime-config.sh`; vacío = sin proxy.
    include /etc/nginx/conf.d/ai-scraper.conf;

    # Fallback de rutas SPA (refrescar /shop, /checkout, …)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html y artefactos del service worker: sin cache
    location = /index.html { expires -1; }
    location = /ngsw-worker.js { expires -1; }
    location = /ngsw.json { expires -1; }
    location = /manifest.webmanifest { expires -1; }

    # Assets con hash: cache larga
    location ~* \.(?:css|js|woff2?|png|jpe?g|svg|gif|ico)$ {
        expires 1y;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

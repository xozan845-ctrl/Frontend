name: Release

# Validación de releases por tag (R-CD-3 / R-GB-3). No es un pipeline de PR:
# se dispara al publicar un tag `v*.*.*` y comprueba que el tag es anotado,
# semver, está en `main`, las versiones coinciden y el SHA tiene `ci.yml` verde.
# Conserva exactamente el paquete validado por CI, sin recompilarlo.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Tag de release existente a validar (p. ej. v1.24.0)"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend-app

jobs:
  gate:
    name: Release gate (tag + procedencia)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.source_tag }}
        run: |
          REF="$GITHUB_REF_NAME"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            REF="${INPUT_TAG}"
          fi
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: '$REF' no es un tag semver válido v<major>.<minor>.<patch>[-pre] (R-CD-3)."
            exit 1
          fi
          SHA=$(git rev-list -n1 "$REF")
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OK: tag $REF → $SHA"

      - name: Verify the release commit is on main
        run: |
          SHA="${{ steps.tag.outputs.sha }}"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "ERROR: $SHA no está en main; no se valida una release fuera de main (R-CD-3)."
            exit 1
          fi
          echo "OK: $SHA es ancestro de origin/main"

      - name: Validate tag, versions and remote tag
        run: |
          node scripts/commands/release-check.mjs \
            --tag "${{ steps.tag.outputs.tag }}" \
            --main-ref origin/main \
            --check-remote

  artifact:
    name: Release validated artifact
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Promote the CI artifact for the exact release SHA and version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.gate.outputs.tag }}
        run: |
          export RELEASE_VERSION="${RELEASE_VERSION#v}"
          node scripts/commands/promote-artifact.mjs

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-release-${{ needs.gate.outputs.tag }}
          path: |
            frontend-app/.ci-artifact
            frontend-app/promotion.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Release summary
        run: |
          {
            echo "### Release ${{ needs.gate.outputs.tag }}"
            echo "- commit: \`${{ needs.gate.outputs.sha }}\`"
            cat promotion.json
            echo "- artifact: \`frontend-release-${{ needs.gate.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

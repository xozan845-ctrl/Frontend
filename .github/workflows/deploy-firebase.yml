name: Deploy Firebase Hosting

# Despliegue automático a producción en cada push a main (o manual).
# Ejecuta los gates críticos en el propio workflow para no depender de la
# disponibilidad de runners de otro workflow. El build incluye
# `APP_VERSION=<package.version>+<run_number>` y las novedades de Git en
# `version.json`; el aviso PWA las consume sin caché.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend-app

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Governance rules
        run: npm run rules:check

      - name: Unit tests
        run: npm test -- --watch=false --coverage=false

      - name: Compute build version
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "APP_VERSION=${BASE}+${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build production
        run: npm run build

      - name: Check Firebase credentials
        id: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT no configurado; deploy omitido."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Firebase Hosting"
              echo "Deploy omitido: falta el secret \`FIREBASE_SERVICE_ACCOUNT\`."
              echo "Configúralo con: \`gh secret set FIREBASE_SERVICE_ACCOUNT < service-account.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Hosting
        if: steps.firebase.outputs.enabled == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: >-
          npx --yes firebase-tools@15.33.0 deploy
          --only hosting
          --project kb-coleccion-internacional-ni
          --non-interactive

      - name: Smoke Hosting
        if: steps.firebase.outputs.enabled == 'true'
        env:
          FRONTEND_URL: https://kb-coleccion-internacional-ni.web.app
        run: node scripts/commands/hosting-smoke.mjs

name: Deploy Firebase Hosting

# Promueve exclusivamente el paquete de CI; nunca reconstruye el frontend.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Run de CI verde en main que contiene el artefacto (también rollback)"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend-app

jobs:
  deploy:
    name: Deploy production
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted promotion tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify CI provenance, download and verify artifact digest
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/commands/promote-artifact.mjs
      - name: Restore hosting configuration from the validated SHA
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git show "$SOURCE_SHA:frontend-app/firebase.json" > firebase.json
          git show "$SOURCE_SHA:frontend-app/.firebaserc" > .firebaserc
      - name: Publish verified package and smoke its identity
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          CI_RUN_ID: ${{ steps.candidate.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.candidate.outputs.ci_run_attempt }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FRONTEND_URL: https://kb-coleccion-internacional-ni.web.app
          AUTOMATIC_PROMOTION: ${{ github.event_name == 'workflow_run' }}
        run: node scripts/commands/publish-firebase.mjs
      - name: Preserve deployment receipt (including omitted/failed delivery)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firebase-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend-app/promotion.json
            frontend-app/deployment.json
          if-no-files-found: ignore
          retention-days: 90

<!--
  Fuente de `public/og-invitacion.png` (1200 × 630): tarjeta Open Graph de la
  invitación de vendedores. Se sirve en `/i/**` y `/registro/vendedor` mediante
  `dist/frontend-app/browser/invitacion.html` (ver
  `scripts/commands/generate-invitation-html.mjs`).
  Regenerar con `npm run og-image`.
-->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 48px;
        padding: 84px;
        background:
          radial-gradient(760px 560px at 82% 18%, rgba(0, 85, 255, 0.32), transparent 64%),
          radial-gradient(680px 520px at 10% 100%, rgba(16, 185, 129, 0.14), transparent 66%),
          #0a0a0a;
        color: #ffffff;
        font-family: 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif;
      }
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 18%, transparent 80%);
        mask-image: radial-gradient(circle at 50% 45%, #000 18%, transparent 80%);
      }
      .content {
        position: relative;
        z-index: 1;
        max-width: 660px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        border: 1px solid rgba(52, 211, 153, 0.35);
        border-radius: 999px;
        background: rgba(16, 185, 129, 0.12);
        color: #6ee7b7;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 20px #34d399;
      }
      .eyebrow {
        margin-top: 32px;
        color: #7ea6ff;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.34em;
        text-transform: uppercase;
      }
      h1 {
        margin-top: 18px;
        font-size: 100px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 0.88;
      }
      h1 span {
        display: block;
        color: #2f7bff;
      }
      p {
        margin-top: 26px;
        max-width: 600px;
        color: #b6bdc9;
        font-size: 24px;
        line-height: 1.35;
      }
      .rule {
        width: 92px;
        height: 5px;
        margin-top: 32px;
        border-radius: 99px;
        background: linear-gradient(90deg, #2f7bff, #34d399);
      }
      .brand {
        position: absolute;
        left: 84px;
        bottom: 48px;
        z-index: 1;
        color: #5f6673;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      .visual {
        position: relative;
        z-index: 1;
        display: grid;
        flex: none;
        place-items: center;
        width: 300px;
        height: 300px;
        border: 1px solid rgba(126, 166, 255, 0.25);
        border-radius: 60px;
        background: linear-gradient(145deg, rgba(0, 85, 255, 0.24), rgba(16, 185, 129, 0.1));
        box-shadow: 0 0 100px rgba(0, 85, 255, 0.25);
      }
      .visual svg.store {
        width: 176px;
        height: 176px;
        color: #ffffff;
        filter: drop-shadow(0 0 30px rgba(47, 123, 255, 0.6));
      }
      .check {
        position: absolute;
        right: -18px;
        bottom: -18px;
        display: grid;
        place-items: center;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 40px rgba(16, 185, 129, 0.55);
      }
      .check svg {
        width: 42px;
        height: 42px;
        color: #052e1c;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="badge"><span class="dot"></span> Invitación verificada</div>
      <div class="eyebrow">Invitación de vendedor</div>
      <h1>TU TIENDA<span>TE ESPERA</span></h1>
      <p>Acepta la invitación y empieza a vender con tu propia tienda.</p>
      <div class="rule"></div>
    </div>

    <div class="visual">
      <svg
        class="store"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 9l1.5-5h15L21 9" />
        <path d="M4 9v11h16V9" />
        <path d="M9 20v-6h6v6" />
        <path d="M3 9h18" />
      </svg>
      <div class="check">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12l5 5L20 7" />
        </svg>
      </div>
    </div>

    <div class="brand">Quantum Store</div>
  </body>
</html>

<!--
  Fuente de `public/og-image.png` (1200 × 630): imagen Open Graph por defecto.
  Regenerar con `npm run og-image` (requiere `npx playwright install chromium`).
  El `SeoService` la publica como `og:image`/`twitter:image` en páginas genéricas.
-->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        display: flex;
        align-items: center;
        gap: 76px;
        padding: 92px 96px;
        background:
          radial-gradient(900px 600px at 78% 18%, rgba(0, 85, 255, 0.3), transparent 62%),
          radial-gradient(700px 520px at 8% 100%, rgba(0, 85, 255, 0.14), transparent 66%), #0a0a0a;
        color: #ffffff;
        font-family: 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif;
      }
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 20%, transparent 82%);
        mask-image: radial-gradient(circle at 50% 45%, #000 20%, transparent 82%);
      }
      .logo {
        position: relative;
        z-index: 1;
        flex: none;
        width: 268px;
        height: 268px;
        filter: drop-shadow(0 0 48px rgba(0, 85, 255, 0.55));
      }
      .content {
        position: relative;
        z-index: 1;
      }
      .eyebrow {
        margin-bottom: 26px;
        color: #7ea6ff;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
      }
      h1 {
        font-size: 106px;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 0.9;
      }
      h1 .store {
        display: block;
        color: #2f7bff;
      }
      p {
        margin-top: 30px;
        color: #a9b0bd;
        font-size: 25px;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
      .rule {
        width: 78px;
        height: 5px;
        margin-top: 38px;
        background: #0055ff;
        border-radius: 99px;
      }
      .domain {
        position: absolute;
        right: 96px;
        bottom: 62px;
        z-index: 1;
        color: #5f6673;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <svg
      class="logo"
      viewBox="0 0 512 512"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="Quantum Store"
    >
      <circle cx="256" cy="256" r="196" fill="none" stroke="#0055ff" stroke-width="30" />
      <circle
        cx="256"
        cy="256"
        r="150"
        fill="none"
        stroke="rgba(0, 85, 255, 0.28)"
        stroke-width="4"
      />
      <circle cx="256" cy="256" r="46" fill="#0055ff" />
    </svg>
    <div class="content">
      <div class="eyebrow">Hardware premium</div>
      <h1>QUANTUM<span class="store">STORE</span></h1>
      <p>Tecnología de alto rendimiento, sin concesiones.</p>
      <div class="rule"></div>
    </div>
    <div class="domain">Quantum Store</div>
  </body>
</html>

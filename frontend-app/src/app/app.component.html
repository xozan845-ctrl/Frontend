<div class="app-layout">
  @if (!isBackoffice()) {
    <app-header />
  }

  <main class="main-content">
    <app-pwa-install-banner />
    <div class="page-transition" style="animation: pageFadeIn 0.3s ease both">
      <router-outlet />
    </div>
  </main>

  @if (!isBackoffice()) {
    <app-footer />
  }
</div>

<app-toast />
@if (!isBackoffice()) {
  @defer (on idle) {
    <app-cart-drawer />
  } @placeholder {
    <span aria-hidden="true"></span>
  }
  @defer (on idle) {
    <app-floating-support />
  } @placeholder {
    <span aria-hidden="true"></span>
  }
}

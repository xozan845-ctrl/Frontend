<div class="mx-auto flex w-full max-w-[1440px] flex-col gap-5" data-testid="logistica-dashboard">
  <header class="flex flex-col gap-4 2xl:flex-row 2xl:items-center 2xl:justify-between">
    <div class="flex items-center gap-3">
      <span
        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-blue-100 text-xl text-accent-600 dark:bg-accent-900/30 dark:text-accent-400"
        aria-hidden="true"
      >
        <i class="fa-solid fa-truck-fast"></i>
      </span>
      <div>
        <h1
          class="font-heading text-2xl font-black tracking-tight text-slate-900 sm:text-3xl dark:text-white"
        >
          Logística
        </h1>
        <p class="text-sm text-slate-500 dark:text-slate-400">
          Monitorea clientes, rutas y entregas en tiempo real.
        </p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <label
        class="flex h-10 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 dark:border-surface-600 dark:bg-surface-800"
      >
        <i class="fa-solid fa-calendar-days text-xs text-slate-400" aria-hidden="true"></i>
        <span class="sr-only">Jornada</span>
        <select
          class="cursor-pointer appearance-none bg-transparent pr-4 text-xs font-semibold text-slate-700 outline-none dark:text-slate-200"
          data-testid="logistica-date-select"
          (change)="onDateChange($event)"
        >
          @for (date of dates; track date) {
            <option [value]="date" [selected]="date === store.dateLabel()">{{ date }}</option>
          }
        </select>
        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400" aria-hidden="true"></i>
      </label>

      <label
        class="flex h-10 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 dark:border-surface-600 dark:bg-surface-800"
      >
        <i class="fa-solid fa-location-dot text-xs text-slate-400" aria-hidden="true"></i>
        <span class="sr-only">Zona</span>
        <select
          class="cursor-pointer appearance-none bg-transparent pr-4 text-xs font-semibold text-slate-700 outline-none dark:text-slate-200"
          data-testid="logistica-zone-select"
          (change)="onZoneChange($event)"
        >
          @for (zone of zones; track zone) {
            <option [value]="zone" [selected]="zone === store.zoneFilter()">{{ zone }}</option>
          }
        </select>
        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400" aria-hidden="true"></i>
      </label>

      <button type="button" class="btn btn-primary btn-sm" data-testid="logistica-new-route">
        <i class="fa-solid fa-plus text-xs" aria-hidden="true"></i>
        Nueva ruta
      </button>

      <button
        type="button"
        class="inline-flex h-10 items-center gap-2 rounded-xl border border-accent-200 bg-white px-4 text-xs font-bold text-accent-600 transition-colors hover:bg-accent-50 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden dark:border-accent-800 dark:bg-surface-800 dark:text-accent-400 dark:hover:bg-surface-700"
        data-testid="logistica-assign-courier"
      >
        <i class="fa-solid fa-user-plus text-xs" aria-hidden="true"></i>
        Asignar repartidor
      </button>

      <button
        type="button"
        class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-500 transition-colors hover:bg-slate-50 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden dark:border-surface-600 dark:bg-surface-800 dark:text-slate-300 dark:hover:bg-surface-700"
        aria-label="Más acciones del tablero"
        data-testid="logistica-more-actions"
      >
        <i class="fa-solid fa-ellipsis" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <section class="grid gap-4 sm:grid-cols-2 2xl:grid-cols-4" aria-label="Resumen del día">
    @if (store.loading()) {
      @for (card of skeletonKpis; track card) {
        <div
          class="flex items-center gap-4 rounded-2xl border border-slate-100 bg-white p-5 dark:border-surface-700 dark:bg-surface-800"
          aria-hidden="true"
        >
          <div class="h-12 w-12 animate-pulse rounded-2xl bg-slate-100 dark:bg-surface-700"></div>
          <div class="flex-1 space-y-2">
            <div class="h-3 w-2/3 animate-pulse rounded bg-slate-100 dark:bg-surface-700"></div>
            <div class="h-6 w-1/3 animate-pulse rounded bg-slate-100 dark:bg-surface-700"></div>
          </div>
        </div>
      }
    } @else {
      @for (kpi of store.kpis(); track kpi.id) {
        <app-logistica-kpi-card
          [label]="kpi.label"
          [value]="kpi.value"
          [hint]="kpi.hint"
          [icon]="kpi.icon"
          [tone]="kpi.tone"
          [testId]="kpi.testId"
        />
      }
    }
  </section>

  <div class="grid gap-5 xl:grid-cols-[minmax(0,1.6fr)_minmax(320px,1fr)]">
    <div class="flex min-w-0 flex-col gap-5">
      <app-logistica-orders-table [orders]="store.filteredOrders()" [loading]="store.loading()" />
    </div>

    <div class="flex min-w-0 flex-col gap-5">
      <app-logistica-deliveries-donut
        [segments]="store.delivery()"
        [total]="store.deliveryTotal()"
      />
      <app-logistica-couriers-list [couriers]="store.couriers()" [loading]="store.loading()" />
      <app-logistica-clients-table
        [clients]="store.filteredClients()"
        [loading]="store.loading()"
      />
    </div>
  </div>
</div>

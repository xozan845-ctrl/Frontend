<section class="card overflow-hidden" data-testid="map-panel">
  <header class="flex flex-wrap items-center justify-between gap-2 px-5 pt-4 pb-3">
    <h2 class="flex items-center gap-2 font-heading text-base font-black tracking-tight uppercase">
      <i class="fa-solid fa-location-dot text-accent-600" aria-hidden="true"></i>
      Mapa de clientes y rutas
    </h2>
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-xl border border-accent-200 px-3 py-1.5 text-[11px] font-bold text-accent-600 transition-colors hover:bg-accent-50 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden dark:border-accent-800 dark:text-accent-400 dark:hover:bg-surface-700"
        data-testid="map-view-all"
      >
        <i class="fa-solid fa-map" aria-hidden="true"></i>
        Ver mapa completo
      </button>
      <button
        type="button"
        class="flex h-7 w-7 items-center justify-center rounded-lg text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden dark:hover:bg-surface-700"
        [attr.aria-label]="'Pantalla completa del mapa'"
        (click)="toggleFullscreen()"
      >
        <i class="fa-solid fa-expand" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <div
    class="relative m-3 mt-0 overflow-hidden rounded-xl border border-slate-100 dark:border-surface-700"
  >
    <div
      #map
      class="z-0 h-[300px] w-full sm:h-[380px] xl:h-[430px]"
      role="application"
      aria-label="Mapa de rutas de entrega en Managua"
    ></div>

    @if (loading()) {
      <div
        class="absolute inset-0 z-10 flex items-center justify-center bg-slate-100/80 backdrop-blur-[1px] dark:bg-surface-800/80"
        aria-live="polite"
      >
        <span
          class="flex items-center gap-2 text-xs font-semibold text-slate-500 dark:text-slate-400"
        >
          <i class="fa-solid fa-circle-notch animate-spin" aria-hidden="true"></i>
          Cargando rutas…
        </span>
      </div>
    }

    <ul
      class="absolute bottom-3 left-3 z-10 flex flex-wrap items-center gap-x-3 gap-y-1 rounded-xl bg-white/95 px-3 py-2 shadow-sm backdrop-blur-sm dark:bg-surface-800/95"
      aria-label="Leyenda de rutas"
    >
      @for (route of legend(); track route.id) {
        <li
          class="flex items-center gap-1.5 text-[11px] font-semibold text-slate-600 dark:text-slate-300"
        >
          <span
            class="h-2.5 w-2.5 rounded-full"
            [class]="toneClasses[route.tone].dot"
            aria-hidden="true"
          ></span>
          {{ route.label }}
        </li>
      }
    </ul>

    <div
      class="absolute top-1/2 right-3 z-10 flex -translate-y-1/2 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-md dark:border-surface-600 dark:bg-surface-800"
    >
      <button
        type="button"
        class="flex h-9 w-9 items-center justify-center text-slate-600 transition-colors hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden dark:text-slate-200 dark:hover:bg-surface-700"
        aria-label="Acercar el mapa"
        data-testid="map-zoom-in"
        (click)="zoomIn()"
      >
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        class="flex h-9 w-9 items-center justify-center border-y border-slate-100 text-slate-600 transition-colors hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden dark:border-surface-700 dark:text-slate-200 dark:hover:bg-surface-700"
        aria-label="Alejar el mapa"
        data-testid="map-zoom-out"
        (click)="zoomOut()"
      >
        <i class="fa-solid fa-minus" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        class="flex h-9 w-9 items-center justify-center text-slate-600 transition-colors hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden dark:text-slate-200 dark:hover:bg-surface-700"
        aria-label="Centrar el mapa en las rutas"
        data-testid="map-center"
        (click)="centerMap()"
      >
        <i class="fa-solid fa-crosshairs" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</section>

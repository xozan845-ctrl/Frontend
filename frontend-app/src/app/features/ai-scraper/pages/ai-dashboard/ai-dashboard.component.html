<section class="mx-auto max-w-6xl space-y-8 px-4 py-8">
  <header class="space-y-3">
    <p class="text-[10px] font-bold uppercase tracking-widest text-accent-600 dark:text-accent-400">
      Scraping con IA
    </p>
    <h1 class="font-heading text-3xl font-black tracking-tight text-black dark:text-white">
      Panel de extracción
    </h1>
    <p class="max-w-2xl text-sm text-slate-500 dark:text-slate-400">
      Configura el endpoint y la API key del backend de IA. Para ejecutar jobs y revisar los datos,
      abre el chat de sesiones.
    </p>
    <nav class="flex flex-wrap gap-2 pt-1">
      <a
        routerLink="/ia/chat"
        class="inline-flex items-center gap-2 rounded-full border border-slate-200 px-4 py-2 text-xs font-bold uppercase tracking-widest text-slate-600 transition-colors hover:border-accent-400 hover:text-accent-600 dark:border-surface-700 dark:text-slate-300 dark:hover:text-accent-400"
      >
        <i class="fa-solid fa-comments" aria-hidden="true"></i>
        Chat de sesiones
      </a>
    </nav>
  </header>

  <app-ai-connection-panel
    [endpoint]="endpoint"
    [hasKey]="hasKey()"
    (save)="saveKey($event)"
    (clear)="clearKey()"
  />
</section>

@if (cards.length > 0) {
  <div class="grid grid-cols-2 gap-3 sm:grid-cols-4" data-testid="ai-metrics-cards">
    @for (card of cards; track card.label) {
      <div
        class="rounded-2xl border border-slate-100 bg-white p-4 transition-colors hover:border-accent-200 dark:border-surface-700 dark:bg-surface-900 dark:hover:border-accent-900/40"
      >
        <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400">
          {{ card.label }}
        </p>
        <p class="mt-1 font-heading text-2xl font-black text-black dark:text-white">
          {{ card.value }}
        </p>
      </div>
    }
  </div>
} @else {
  <p class="text-sm text-slate-400" data-testid="ai-metrics-empty">
    Sin métricas todavía. Conecta con el backend de IA.
  </p>
}

@if (cards.length > 0) {
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" data-testid="ai-metrics-cards">
    @for (card of cards; track card.label) {
      <div
        class="rounded-2xl border border-slate-100 dark:border-surface-800 bg-white dark:bg-surface-900 p-3"
      >
        <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400">
          {{ card.label }}
        </p>
        <p class="text-2xl font-black text-black dark:text-white">{{ card.value }}</p>
      </div>
    }
  </div>
} @else {
  <p class="text-sm text-slate-400" data-testid="ai-metrics-empty">
    Sin métricas todavía. Conecta con el backend de IA.
  </p>
}

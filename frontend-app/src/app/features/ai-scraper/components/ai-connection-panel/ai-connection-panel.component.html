<section
  class="rounded-3xl border border-slate-100 bg-white p-6 dark:border-surface-700 dark:bg-surface-900"
  data-testid="ai-connection-panel"
>
  <div class="flex items-start gap-3">
    <span
      class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-accent-50 text-accent-600 dark:bg-accent-900/30 dark:text-accent-400"
      aria-hidden="true"
    >
      <i class="fa-solid fa-plug-circle-bolt"></i>
    </span>
    <div class="min-w-0">
      <h2
        class="font-heading text-lg font-black uppercase tracking-tight text-black dark:text-white"
      >
        Conexión
      </h2>
      <p class="mt-0.5 text-sm text-slate-500 dark:text-slate-400">
        Endpoint:
        <code class="text-xs break-all">{{ endpoint() || 'no configurado' }}</code>
      </p>
    </div>
  </div>

  <form class="mt-4 flex flex-col gap-3 sm:flex-row" (submit)="$event.preventDefault(); onSubmit()">
    <label class="sr-only" for="ai-api-key">API key</label>
    <input
      id="ai-api-key"
      type="password"
      autocomplete="off"
      placeholder="API key (si el backend la exige)"
      [value]="key()"
      (input)="onInput($event)"
      class="flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-black outline-hidden focus:border-accent-500 focus:ring-2 focus:ring-accent-500/20 dark:border-surface-700 dark:bg-surface-800 dark:text-white"
      data-testid="ai-api-key-input"
    />
    <button
      type="submit"
      class="rounded-xl bg-accent-600 px-5 py-2.5 text-sm font-bold uppercase tracking-widest text-white transition-colors hover:bg-accent-700"
      data-testid="ai-api-key-save"
    >
      Guardar
    </button>
    @if (hasKey()) {
      <button
        type="button"
        (click)="clear.emit()"
        class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-bold uppercase tracking-widest text-slate-500 transition-colors hover:border-slate-300 hover:text-slate-700 dark:border-surface-700 dark:text-slate-300 dark:hover:text-white"
        data-testid="ai-api-key-clear"
      >
        Olvidar
      </button>
    }
  </form>

  <p
    class="mt-2 flex items-center gap-2 text-xs"
    [class]="hasKey() ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'"
  >
    <i
      class="fa-solid"
      [class.fa-circle-check]="hasKey()"
      [class.fa-circle-info]="!hasKey()"
      aria-hidden="true"
    ></i>
    {{
      hasKey()
        ? 'API key configurada en esta sesión.'
        : 'Sin API key (el backend debe permitir el acceso).'
    }}
  </p>
</section>

@if (items().length > 0) {
  <div class="overflow-x-auto" data-testid="ai-results-table">
    <table class="w-full text-sm">
      <thead>
        <tr class="text-left text-[11px] uppercase tracking-widest text-slate-400">
          @for (column of columns(); track column) {
            <th class="py-2 pr-4">{{ column }}</th>
          }
          <th class="py-2 pr-4">origen</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track $index) {
          <tr class="border-t border-slate-100 dark:border-surface-800">
            @for (column of columns(); track column) {
              <td class="py-2 pr-4 text-slate-700 dark:text-slate-200">
                {{ display(item, column) }}
              </td>
            }
            <td class="py-2 pr-4 text-xs text-slate-400 truncate max-w-[16rem]">
              {{ source(item) }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
} @else {
  <p class="text-sm text-slate-400" data-testid="ai-results-empty">
    Este job todavía no tiene resultados.
  </p>
}

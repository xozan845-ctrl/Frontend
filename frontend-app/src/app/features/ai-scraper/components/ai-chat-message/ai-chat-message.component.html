@if (isUser()) {
  <div class="flex justify-end" data-testid="ai-chat-message">
    <p
      class="max-w-[80%] rounded-2xl rounded-br-sm bg-accent-600 text-white px-4 py-2 text-sm whitespace-pre-line"
    >
      {{ message().content }}
    </p>
  </div>
} @else {
  <div class="flex justify-start" data-testid="ai-chat-message">
    <p
      class="max-w-[80%] rounded-2xl rounded-bl-sm bg-slate-100 dark:bg-surface-800 text-slate-700 dark:text-slate-200 px-4 py-2 text-sm whitespace-pre-line"
    >
      {{ message().content }}
    </p>
  </div>
}

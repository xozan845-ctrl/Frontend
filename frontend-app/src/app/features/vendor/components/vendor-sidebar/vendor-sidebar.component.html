@if (open()) {
  <div
    class="fixed inset-0 z-30 bg-black/40 backdrop-blur-sm lg:hidden"
    (click)="closed.emit()"
    role="presentation"
  ></div>
}

<aside
  class="fixed inset-y-0 left-0 z-40 flex w-64 shrink-0 flex-col overflow-y-auto bg-surface-900 text-slate-300 shadow-2xl transition-transform duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] motion-reduce:transition-none lg:sticky lg:top-0 lg:z-10 lg:h-dvh lg:translate-x-0 lg:shadow-none"
  [class]="open() ? 'translate-x-0' : '-translate-x-full invisible lg:visible'"
  aria-label="Navegación del panel del vendedor"
>
  <nav class="flex flex-1 flex-col p-4">
    <p class="px-3.5 pt-3 pb-2 text-[10px] font-black tracking-[0.25em] text-slate-500 uppercase">
      Tienda
    </p>
    <div class="flex flex-col gap-1">
      @for (item of mainItems; track item.link) {
        <a
          [routerLink]="item.link"
          routerLinkActive="bg-accent-600 text-white shadow-lg shadow-accent-600/25 hover:bg-accent-600 hover:text-white"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          [attr.data-testid]="item.testId"
          (click)="itemSelected.emit()"
          class="group flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-300 transition-colors hover:bg-white/5 hover:text-white focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden"
        >
          <i class="w-5 text-center text-base" [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </div>

    <div class="mt-auto flex flex-col gap-1 border-t border-white/10 pt-4">
      @for (item of footerItems; track item.link) {
        <a
          [routerLink]="item.link"
          routerLinkActive="bg-accent-600 text-white shadow-lg shadow-accent-600/25 hover:bg-accent-600 hover:text-white"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          [attr.data-testid]="item.testId"
          (click)="itemSelected.emit()"
          class="group flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-300 transition-colors hover:bg-white/5 hover:text-white focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden"
        >
          <i class="w-5 text-center text-base" [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </div>
  </nav>
</aside>

@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    data-testid="create-client-modal"
  >
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" aria-hidden="true"></div>

    <div
      class="relative w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl motion-safe:animate-scale-in dark:bg-surface-800"
      role="dialog"
      aria-modal="true"
      aria-labelledby="create-client-title"
      tabindex="-1"
      [appFocusTrap]="open()"
      (escape)="dismiss.emit()"
      data-testid="create-client-dialog"
    >
      <header class="mb-4 flex items-start justify-between gap-3">
        <div>
          <h2
            id="create-client-title"
            class="font-heading text-xl font-black tracking-tight uppercase text-slate-900 dark:text-white"
          >
            Nuevo cliente
          </h2>
          <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
            Se guardará en tu cartera y quedará seleccionado para el pedido.
          </p>
        </div>
        <button
          type="button"
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden dark:hover:bg-surface-700 dark:hover:text-slate-200"
          aria-label="Cerrar"
          data-testid="close-client-modal"
          (click)="dismiss.emit()"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </header>

      @if (error(); as message) {
        <div
          class="mb-4 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-bold text-red-600 dark:border-red-800 dark:bg-red-900/10 dark:text-red-400"
          data-testid="create-client-error"
        >
          {{ message }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submitForm()" class="flex flex-col gap-4" novalidate>
        <div class="flex flex-col gap-2">
          <label
            for="client-name"
            class="text-[10px] font-bold tracking-widest text-slate-500 uppercase"
          >
            Nombre *
          </label>
          <input
            id="client-name"
            type="text"
            formControlName="name"
            class="input"
            [class.input-error]="isInvalid('name')"
            placeholder="Ej. Carla López"
            data-testid="client-name"
          />
          @if (isInvalid('name')) {
            <span class="text-[10px] font-bold tracking-widest text-red-500 uppercase">
              Escribe al menos 2 caracteres
            </span>
          }
        </div>

        <div class="flex flex-col gap-2">
          <label
            for="client-phone"
            class="text-[10px] font-bold tracking-widest text-slate-500 uppercase"
          >
            Teléfono
          </label>
          <input
            id="client-phone"
            type="tel"
            formControlName="phone"
            class="input"
            placeholder="+505 8888 8888"
            data-testid="client-phone"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label
            for="client-email"
            class="text-[10px] font-bold tracking-widest text-slate-500 uppercase"
          >
            Correo
          </label>
          <input
            id="client-email"
            type="email"
            formControlName="email"
            class="input"
            [class.input-error]="isInvalid('email')"
            placeholder="cliente@correo.com"
            data-testid="client-email"
          />
          @if (isInvalid('email')) {
            <span class="text-[10px] font-bold tracking-widest text-red-500 uppercase">
              Correo inválido
            </span>
          }
        </div>

        <div class="mt-2 flex justify-end gap-2">
          <button
            type="button"
            class="btn btn-secondary"
            data-testid="cancel-client"
            (click)="dismiss.emit()"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="creating()"
            data-testid="submit-client"
          >
            {{ creating() ? 'Guardando…' : 'Guardar cliente' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}

<div class="mx-auto flex w-full max-w-7xl flex-col gap-6" data-testid="orders-page">
  <header class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <nav
        aria-label="Ruta de navegación"
        class="mb-2 flex items-center gap-2 text-[10px] font-bold tracking-widest text-slate-400 uppercase"
      >
        <a routerLink="/vendedor/inicio" class="transition-colors hover:text-accent-600">
          Inicio
        </a>
        <i class="fa-solid fa-chevron-right text-[8px]" aria-hidden="true"></i>
        <span aria-current="page" class="text-accent-600 dark:text-accent-400">Pedidos</span>
      </nav>
      <h1
        class="font-heading text-3xl font-black tracking-tighter text-slate-900 uppercase dark:text-white"
      >
        Pedidos
      </h1>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
        Filtra por estado y abre cualquier pedido para ver su detalle.
      </p>
    </div>
    <button
      type="button"
      class="btn btn-secondary self-start sm:self-auto"
      [disabled]="orders.loading()"
      data-testid="refresh-orders"
      (click)="orders.refresh()"
    >
      <i
        class="fa-solid fa-rotate text-xs"
        [class.animate-spin]="orders.loading()"
        aria-hidden="true"
      ></i>
      Actualizar
    </button>
  </header>

  <div class="flex flex-wrap gap-2" role="group" aria-label="Filtrar por estado">
    <button
      type="button"
      [class]="chipClasses(orders.statusFilter() === null)"
      data-testid="filter-all"
      (click)="setFilter(null)"
    >
      Todas
      <span class="opacity-70" data-testid="count-all">({{ orders.orders().length }})</span>
    </button>
    @for (status of statuses; track status) {
      <button
        type="button"
        [class]="chipClasses(orders.statusFilter() === status)"
        [attr.data-testid]="'filter-' + status"
        (click)="setFilter(status)"
      >
        {{ labels[status] }}
        <span class="opacity-70" [attr.data-testid]="'count-' + status">
          ({{ orders.statusCounts()[status] }})
        </span>
      </button>
    }
  </div>

  <app-recent-orders-table
    [orders]="orders.filteredOrders()"
    [loading]="orders.loading()"
    [error]="orders.error()"
    [lastUpdatedAt]="orders.lastUpdatedAt()"
    title="Pedidos registrados"
    [showViewAll]="false"
    [emptyTitle]="emptyTitle()"
    [emptySubtitle]="emptySubtitle()"
    (retry)="orders.loadOrders()"
  />
</div>

<section
  class="min-h-[70vh] flex items-center justify-center px-4 py-24 bg-slate-50 dark:bg-surface-900 transition-colors duration-300"
>
  <div
    class="w-full max-w-lg bg-white dark:bg-surface-800 border border-slate-100 dark:border-surface-700 rounded-3xl shadow-xl p-10 text-center"
  >
    <div
      class="inline-block bg-accent-100 dark:bg-accent-900/30 text-accent-700 dark:text-accent-400 text-[10px] font-bold uppercase tracking-widest px-4 py-1.5 rounded-full mb-6"
    >
      Plataforma multi-tienda
    </div>

    <h1 class="text-3xl font-black uppercase tracking-tighter font-heading mb-4">
      Elige tu tienda
    </h1>

    <p class="text-slate-500 dark:text-slate-400 font-medium mb-8">
      Cada vendedor tiene su propia tienda. Introduce el identificador de la tienda para entrar a su
      catálogo.
    </p>

    <div class="flex flex-col sm:flex-row gap-3">
      <label class="sr-only" for="storeId">Identificador de tienda</label>
      <input
        id="storeId"
        type="text"
        (input)="onInput($event)"
        (keyup.enter)="goToStore()"
        placeholder="Identificador de la tienda"
        class="input flex-1"
      />
      <button type="button" class="btn btn-primary btn-md" (click)="goToStore()">Entrar</button>
    </div>
  </div>
</section>

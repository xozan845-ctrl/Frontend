<div class="overflow-x-auto" data-testid="invoice-lines-table">
  <table class="w-full min-w-[640px] text-left text-sm">
    <caption class="sr-only">
      Líneas de la factura
    </caption>
    <thead>
      <tr
        class="border-b border-slate-100 text-[10px] tracking-widest text-slate-400 uppercase dark:border-surface-700"
      >
        <th scope="col" class="py-2 pr-3 font-bold">Producto</th>
        <th scope="col" class="py-2 pr-3 font-bold">Código</th>
        <th scope="col" class="py-2 pr-3 text-right font-bold">Cant.</th>
        <th scope="col" class="py-2 pr-3 text-right font-bold">Precio</th>
        <th scope="col" class="py-2 text-right font-bold">Importe</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-50 dark:divide-surface-800">
      @for (line of lines(); track line.productId) {
        <tr data-testid="invoice-line-row">
          <td class="py-3 pr-3 font-bold text-slate-900 dark:text-white">
            {{ line.productName }}
          </td>
          <td class="py-3 pr-3 font-mono text-xs text-slate-500 dark:text-slate-400">
            {{ line.sku }}
          </td>
          <td class="py-3 pr-3 text-right tabular-nums text-slate-600 dark:text-slate-300">
            {{ line.quantity }}
          </td>
          <td class="py-3 pr-3 text-right tabular-nums text-slate-600 dark:text-slate-300">
            {{ line.unitPrice | appCurrency }}
          </td>
          <td
            class="py-3 text-right font-bold tabular-nums text-slate-900 dark:text-white"
            data-testid="invoice-line-total"
          >
            {{ lineTotal(line) | appCurrency }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

@if (products().length > 0) {
  <div>
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <h3
        class="text-xl font-black uppercase tracking-tighter text-slate-900 dark:text-white flex items-center gap-3"
      >
        <i class="fa-solid fa-clock-rotate-left text-accent-600 dark:text-accent-400 text-base"></i>
        {{ title() }}
      </h3>
      <div class="flex gap-2">
        <button
          (click)="prev()"
          [disabled]="currentIndex() === 0"
          class="w-9 h-9 rounded-xl border border-slate-200 dark:border-surface-700 bg-white dark:bg-surface-800 flex items-center justify-center text-slate-500 hover:text-accent-600 dark:hover:text-accent-400 hover:border-accent-600 dark:hover:border-accent-500 disabled:opacity-30 disabled:cursor-not-allowed transition-all shadow-sm"
          aria-label="Anterior"
        >
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <button
          (click)="next()"
          [disabled]="!canGoNext()"
          class="w-9 h-9 rounded-xl border border-slate-200 dark:border-surface-700 bg-white dark:bg-surface-800 flex items-center justify-center text-slate-500 hover:text-accent-600 dark:hover:text-accent-400 hover:border-accent-600 dark:hover:border-accent-500 disabled:opacity-30 disabled:cursor-not-allowed transition-all shadow-sm"
          aria-label="Siguiente"
        >
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Carousel Track -->
    <div class="flex gap-4 overflow-x-auto pb-4 snap-x snap-mandatory hide-scrollbar -mx-4 px-4">
      @for (product of visibleProducts(); track product.id; let i = $index) {
        <a
          [routerLink]="['/product', product.id]"
          class="shrink-0 snap-start w-full sm:w-[calc(50%-16px)] lg:w-[calc(33.333%-16px)] xl:w-[calc(25%-16px)] group flex flex-col bg-white dark:bg-surface-800 rounded-2xl border border-slate-100 dark:border-surface-700 overflow-hidden hover:shadow-lg hover:-translate-y-1 transition-all duration-300 shadow-sm"
        >
          <!-- Image -->
          <div
            class="relative aspect-square bg-slate-50 dark:bg-surface-900 flex items-center justify-center overflow-hidden"
          >
            @if (i === 0) {
              <img
                [ngSrc]="product.imageUrl"
                fill
                priority
                [alt]="product.name"
                class="object-cover mix-blend-multiply dark:mix-blend-normal p-3 group-hover:scale-105 transition-transform duration-500"
                (error)="$any($event.target).classList.add('img-error')"
              />
            } @else {
              <img
                [ngSrc]="product.imageUrl"
                fill
                [alt]="product.name"
                class="object-cover mix-blend-multiply dark:mix-blend-normal p-3 group-hover:scale-105 transition-transform duration-500"
                (error)="$any($event.target).classList.add('img-error')"
              />
            }
            <div
              class="img-fallback absolute inset-0 flex items-center justify-center bg-slate-100 dark:bg-surface-800 rounded-xl"
              style="display: none"
            >
              <i class="fa-solid fa-image text-slate-400 dark:text-surface-600 text-lg"></i>
            </div>
          </div>
          <!-- Info -->
          <div class="p-3">
            <p
              class="text-[10px] font-bold uppercase tracking-widest text-accent-600 dark:text-accent-400 mb-1"
            >
              {{ product.category }}
            </p>
            <h4
              class="text-xs font-bold text-slate-800 dark:text-white line-clamp-2 leading-tight group-hover:text-accent-600 dark:group-hover:text-accent-400 transition-colors"
            >
              {{ product.name }}
            </h4>
            <p class="text-sm font-black text-slate-900 dark:text-white mt-2 tracking-tighter">
              {{ '$' }}{{ product.price.toFixed(2) }}
            </p>
          </div>
        </a>
      }
    </div>
  </div>
}

<div class="min-h-screen bg-slate-50 dark:bg-surface-900">
  <!-- Barra móvil del panel -->
  <div
    class="sticky top-0 z-30 flex items-center gap-3 border-b border-slate-100 bg-white/90 px-4 py-3 backdrop-blur-md lg:hidden dark:border-surface-800 dark:bg-surface-900/90"
  >
    <button
      type="button"
      class="rounded-xl p-2.5 text-slate-600 transition-colors hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden dark:text-slate-300 dark:hover:bg-surface-800"
      data-testid="vendor-sidebar-toggle"
      aria-label="Abrir menú del panel"
      aria-controls="vendor-sidebar"
      [attr.aria-expanded]="isSidebarOpen()"
      (click)="isSidebarOpen.set(true)"
    >
      <i class="fa-solid fa-bars text-lg" aria-hidden="true"></i>
    </button>
    <span
      class="font-heading text-sm font-black tracking-widest text-slate-900 uppercase dark:text-white"
    >
      Panel del vendedor
    </span>
  </div>

  <div class="lg:flex">
    <app-vendor-sidebar
      id="vendor-sidebar"
      [open]="isSidebarOpen()"
      [groups]="navGroups"
      (closed)="closeSidebar()"
      (itemSelected)="closeSidebar()"
    />
    <main class="min-w-0 flex-1 px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
      <router-outlet />
    </main>
  </div>
</div>

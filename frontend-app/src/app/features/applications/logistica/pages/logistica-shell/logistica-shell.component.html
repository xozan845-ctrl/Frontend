<div class="app-shell-bg min-h-screen">
  <!-- Barra móvil del módulo -->
  <div class="glass-bar sticky top-0 z-30 flex items-center gap-3 px-4 py-3 lg:hidden">
    <button
      type="button"
      class="rounded-xl p-2.5 text-slate-600 transition-colors hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden dark:text-slate-300 dark:hover:bg-surface-800"
      data-testid="logistica-sidebar-toggle"
      aria-label="Abrir menú de logística"
      aria-controls="logistica-sidebar"
      [attr.aria-expanded]="isSidebarOpen()"
      (click)="isSidebarOpen.set(true)"
    >
      <i class="fa-solid fa-bars text-lg" aria-hidden="true"></i>
    </button>
    <span
      class="font-heading text-sm font-black tracking-widest text-slate-900 uppercase dark:text-white"
    >
      {{ contextLabel() }}
    </span>
  </div>

  <div class="lg:flex">
    <app-logistica-sidebar
      id="logistica-sidebar"
      [open]="isSidebarOpen()"
      [basePath]="basePath()"
      (closed)="closeSidebar()"
      (itemSelected)="closeSidebar()"
    />
    <main class="min-w-0 flex-1 px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
      <router-outlet />
    </main>
  </div>
</div>

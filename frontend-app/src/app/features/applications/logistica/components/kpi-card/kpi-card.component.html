<article
  class="flex items-center justify-between gap-3 rounded-2xl border p-4 shadow-sm transition-shadow hover:shadow-md sm:p-5"
  [class]="toneClasses().card"
  [attr.data-testid]="testId()"
>
  <div class="flex min-w-0 items-center gap-3.5">
    <span
      class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl text-xl"
      [class]="toneClasses().icon"
      aria-hidden="true"
    >
      <i [class]="icon()"></i>
    </span>
    <div class="min-w-0">
      <p class="text-sm font-semibold text-slate-600 dark:text-slate-300">{{ label() }}</p>
      <p
        class="font-heading text-3xl leading-tight font-black tabular-nums text-slate-900 dark:text-white"
      >
        {{ value() }}
      </p>
      @if (hint()) {
        <p class="truncate text-xs font-medium text-slate-500 dark:text-slate-400">{{ hint() }}</p>
      }
    </div>
  </div>

  <span
    class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full"
    [class]="toneClasses().chevron"
    aria-hidden="true"
  >
    <i class="fa-solid fa-chevron-right text-xs"></i>
  </span>
</article>

@if (isUser()) {
  <div class="flex justify-end" data-testid="ai-chat-message">
    <p
      class="glass-strong max-w-[80%] whitespace-pre-line rounded-2xl rounded-br-sm px-4 py-3 text-sm leading-6 text-slate-800 dark:text-slate-100"
    >
      {{ message().content }}
    </p>
  </div>
} @else {
  <div class="flex justify-start gap-3" data-testid="ai-chat-message">
    <span
      class="mt-0.5 grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-black text-xs text-white dark:bg-white dark:text-black"
      aria-hidden="true"
    >
      <i class="fa-solid fa-spider"></i>
    </span>
    <p
      class="glass-subtle max-w-[80%] whitespace-pre-line rounded-2xl rounded-bl-sm px-4 py-3 text-sm leading-6 text-slate-700 dark:text-slate-200"
    >
      {{ message().content }}
    </p>
  </div>
}

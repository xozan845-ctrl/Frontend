<div class="min-h-[70vh] bg-slate-50 dark:bg-surface-900 py-16 px-4 transition-colors duration-300">
  <div class="max-w-2xl mx-auto flex flex-col gap-8">
    <!-- Perfil -->
    <section class="card p-8">
      <h1 class="text-3xl font-black uppercase tracking-tighter font-heading mb-6">Mi Cuenta</h1>

      <div class="flex items-center gap-4">
        <div
          class="w-12 h-12 bg-accent-600 text-white flex items-center justify-center font-black text-lg rounded-full"
        >
          {{ authStore.user()?.name?.charAt(0) | uppercase }}
        </div>
        <div class="flex flex-col">
          <span class="font-black text-lg uppercase tracking-tight" data-testid="account-name">{{
            authStore.user()?.name
          }}</span>
          <span class="text-sm text-slate-500 dark:text-slate-400" data-testid="account-email">{{
            profile()?.email ?? authStore.user()?.email
          }}</span>
        </div>
      </div>

      @if (profile()?.role) {
        <div class="mt-6">
          <span class="badge badge-primary">{{ profile()!.role }}</span>
        </div>
      }

      <a routerLink="/cuenta/pedidos" class="btn btn-secondary btn-md mt-8">
        <i class="fa-solid fa-box mr-2" aria-hidden="true"></i> Mis pedidos
      </a>
    </section>

    <app-change-password-form
      [submitting]="submitting()"
      (passwordSubmit)="onPasswordSubmit($event)"
    />
  </div>
</div>

@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    data-testid="inventory-settings-modal"
  >
    <div
      class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"
      aria-hidden="true"
      (click)="close()"
    ></div>
    <div
      class="relative w-full max-w-lg rounded-3xl bg-white p-6 shadow-2xl dark:bg-surface-800"
      role="dialog"
      aria-modal="true"
      aria-labelledby="inventory-settings-title"
      [appFocusTrap]="true"
      (escape)="close()"
    >
      <h2
        id="inventory-settings-title"
        class="font-heading text-xl font-black text-slate-900 dark:text-white"
      >
        Configuración de inventario
      </h2>
      <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
        Define cómo se costea el inventario y qué alertas se activan.
      </p>

      @if (error(); as message) {
        <div
          class="mt-4 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-bold text-red-600"
          role="alert"
        >
          {{ message }}
        </div>
      }

      <form class="mt-4 flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="flex flex-col gap-1">
          <label
            for="inventory-cost-method"
            class="text-xs font-semibold text-slate-600 dark:text-slate-300"
          >
            Método de costeo
          </label>
          <select
            id="inventory-cost-method"
            class="input"
            formControlName="costMethod"
            data-testid="inventory-cost-method"
          >
            <option value="promedio">Promedio ponderado</option>
            <option value="fifo">FIFO (primero en entrar)</option>
            <option value="ueps">UEPS (último en entrar)</option>
          </select>
        </div>

        <div class="flex flex-col gap-1">
          <label
            for="inventory-default-unit"
            class="text-xs font-semibold text-slate-600 dark:text-slate-300"
          >
            Unidad por defecto
          </label>
          <input
            id="inventory-default-unit"
            class="input"
            formControlName="defaultUnit"
            data-testid="inventory-default-unit"
          />
        </div>

        <div
          class="flex flex-col gap-2 rounded-xl border border-slate-200 p-3 dark:border-surface-700"
        >
          <label
            class="flex items-center gap-2 text-xs font-semibold text-slate-600 dark:text-slate-300"
          >
            <input
              type="checkbox"
              formControlName="allowNegativeStock"
              data-testid="inventory-negative-stock"
            />
            Permitir stock negativo
          </label>
          <label
            class="flex items-center gap-2 text-xs font-semibold text-slate-600 dark:text-slate-300"
          >
            <input
              type="checkbox"
              formControlName="lowStockAlert"
              data-testid="inventory-low-stock-alert"
            />
            Alertar cuando el stock esté bajo
          </label>
          <label
            class="flex items-center gap-2 text-xs font-semibold text-slate-600 dark:text-slate-300"
          >
            <input
              type="checkbox"
              formControlName="updateCostOnPurchase"
              data-testid="inventory-update-cost"
            />
            Actualizar el costo al registrar compras
          </label>
        </div>

        <div class="flex justify-end gap-2">
          <button
            type="button"
            class="btn btn-secondary"
            data-testid="cancel-inventory-settings"
            (click)="close()"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            data-testid="save-inventory-settings"
            [disabled]="saving()"
          >
            {{ saving() ? 'Guardando…' : 'Guardar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}

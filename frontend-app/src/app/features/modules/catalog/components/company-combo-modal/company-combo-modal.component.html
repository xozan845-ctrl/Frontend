@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" data-testid="combo-modal">
    <div
      class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"
      aria-hidden="true"
      (click)="close()"
    ></div>
    <div
      class="relative flex max-h-[90dvh] w-full max-w-2xl flex-col overflow-hidden rounded-3xl bg-white shadow-2xl dark:bg-surface-800"
      role="dialog"
      aria-modal="true"
      aria-labelledby="combo-modal-title"
      [appFocusTrap]="true"
      (escape)="close()"
    >
      <header
        class="flex items-center justify-between border-b border-slate-100 px-6 py-4 dark:border-surface-700"
      >
        <h2
          id="combo-modal-title"
          class="font-heading text-xl font-black text-slate-900 dark:text-white"
        >
          {{ isEdit() ? 'Editar' : 'Nuevo' }} combo
        </h2>
        <button
          type="button"
          aria-label="Cerrar"
          class="text-slate-400"
          data-testid="close-combo-modal"
          (click)="close()"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </header>

      <form
        class="min-h-0 flex-1 overflow-y-auto px-6 py-4"
        [formGroup]="form"
        (ngSubmit)="submit()"
        novalidate
      >
        @if (error(); as message) {
          <div
            class="mb-3 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-bold text-red-600"
            role="alert"
          >
            {{ message }}
          </div>
        }

        <div class="grid gap-3 sm:grid-cols-2">
          <div class="flex flex-col gap-1">
            <label for="combo-name" class="text-xs font-semibold text-slate-600 dark:text-slate-300"
              >Nombre</label
            >
            <input id="combo-name" class="input" formControlName="name" data-testid="combo-name" />
          </div>
          <div class="flex flex-col gap-1">
            <label for="combo-sku" class="text-xs font-semibold text-slate-600 dark:text-slate-300"
              >SKU</label
            >
            <input id="combo-sku" class="input" formControlName="sku" data-testid="combo-sku" />
          </div>
          <div class="flex flex-col gap-1">
            <label
              for="combo-price"
              class="text-xs font-semibold text-slate-600 dark:text-slate-300"
              >Precio</label
            >
            <input
              id="combo-price"
              class="input"
              inputmode="decimal"
              formControlName="price"
              data-testid="combo-price"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label
              for="combo-barcode"
              class="text-xs font-semibold text-slate-600 dark:text-slate-300"
              >Código de barras</label
            >
            <input
              id="combo-barcode"
              class="input"
              formControlName="barcode"
              data-testid="combo-barcode"
            />
          </div>
          <div class="flex flex-col gap-1 sm:col-span-2">
            <label
              for="combo-description"
              class="text-xs font-semibold text-slate-600 dark:text-slate-300"
              >Descripción</label
            >
            <input
              id="combo-description"
              class="input"
              formControlName="description"
              data-testid="combo-description"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label
              for="combo-status"
              class="text-xs font-semibold text-slate-600 dark:text-slate-300"
              >Estado</label
            >
            <select
              id="combo-status"
              class="input"
              formControlName="status"
              data-testid="combo-status"
            >
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </div>
        </div>

        <section class="mt-4">
          <div class="flex items-center justify-between">
            <h3 class="text-[11px] font-black tracking-widest text-slate-400 uppercase">
              Componentes
            </h3>
            <button
              type="button"
              class="text-xs font-bold text-emerald-600"
              data-testid="combo-add-component"
              (click)="addComponent()"
            >
              + Agregar
            </button>
          </div>
          <div class="mt-2 flex flex-col gap-2">
            @for (component of components(); track $index) {
              <div
                class="grid gap-2 rounded-xl border border-slate-200 p-2 sm:grid-cols-[1fr_80px_auto] dark:border-surface-700"
              >
                <select
                  class="input"
                  [value]="component.productId"
                  [attr.data-testid]="'combo-component-' + $index"
                  (change)="selectProduct($index, $any($event.target).value)"
                >
                  <option value="">Selecciona un producto</option>
                  @for (product of products(); track product.id) {
                    <option [value]="product.id">{{ product.name }} · {{ product.sku }}</option>
                  }
                </select>
                <input
                  class="input"
                  type="number"
                  min="1"
                  [value]="component.quantity"
                  [attr.data-testid]="'combo-quantity-' + $index"
                  (input)="setQuantity($index, $any($event.target).value)"
                />
                <button
                  type="button"
                  class="text-xs font-bold text-red-500"
                  data-testid="combo-remove-component"
                  (click)="removeComponent($index)"
                >
                  Quitar
                </button>
              </div>
            }
          </div>
        </section>
      </form>

      <footer
        class="flex justify-end gap-2 border-t border-slate-100 px-6 py-4 dark:border-surface-700"
      >
        <button
          type="button"
          class="btn btn-secondary"
          data-testid="cancel-combo"
          (click)="close()"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary"
          data-testid="save-combo"
          [disabled]="saving()"
          (click)="submit()"
        >
          {{ saving() ? 'Guardando…' : 'Guardar' }}
        </button>
      </footer>
    </div>
  </div>
}

<section
  class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-6"
  aria-label="Resumen de compras"
>
  @for (card of cards(); track card.label) {
    <article class="card flex items-start gap-3 p-4">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl"
        [ngClass]="card.iconClass"
        aria-hidden="true"
      >
        <i [class]="card.icon"></i>
      </span>
      <div class="min-w-0">
        <p class="truncate text-[10px] font-bold tracking-widest text-slate-400 uppercase">
          {{ card.label }}
        </p>
        <p class="mt-0.5 truncate font-heading text-lg font-black tabular-nums">
          {{ card.value }}
        </p>
        <p class="truncate text-[10px] text-slate-400">{{ card.hint }}</p>
      </div>
    </article>
  }
</section>

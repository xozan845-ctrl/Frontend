<section class="mt-6" [formGroup]="form()" aria-labelledby="product-status-title">
  <h3
    id="product-status-title"
    class="mb-3 border-b border-slate-100 pb-2 text-[11px] font-black tracking-widest text-slate-400 uppercase dark:border-surface-700"
  >
    Estado
  </h3>
  <div class="grid gap-3 sm:grid-cols-2">
    <div class="flex flex-col gap-1">
      <label for="product-status" class="text-xs font-semibold text-slate-600 dark:text-slate-300">
        Estado del registro
      </label>
      <select
        id="product-status"
        class="input"
        formControlName="status"
        data-testid="product-modal-status"
      >
        <option value="activo">✅ Activo</option>
        <option value="inactivo">⛔ Inactivo</option>
      </select>
    </div>
    <div class="flex flex-col gap-1">
      <label
        for="product-created-at"
        class="text-xs font-semibold text-slate-600 dark:text-slate-300"
      >
        Fecha de creación
      </label>
      <input
        id="product-created-at"
        type="date"
        class="input"
        formControlName="createdAt"
        data-testid="product-modal-created-at"
      />
      <p class="text-[10px] text-slate-400">
        Cámbiala si el registro ya existía antes de usar el sistema.
      </p>
    </div>
  </div>
</section>

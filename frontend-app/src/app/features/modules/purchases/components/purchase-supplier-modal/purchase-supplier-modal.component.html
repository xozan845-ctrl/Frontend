@if (open()) {
  <div class="fixed inset-0 z-[60] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm" aria-hidden="true"></div>

    <div
      class="relative flex max-h-[92vh] w-full max-w-lg flex-col overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-2xl motion-safe:animate-scale-in dark:border-surface-700 dark:bg-surface-800"
      role="dialog"
      aria-modal="true"
      aria-labelledby="purchase-supplier-title"
      tabindex="-1"
      [appFocusTrap]="open()"
      (escape)="dismiss.emit()"
      data-testid="purchase-supplier-dialog"
    >
      <header
        class="flex items-start justify-between gap-3 border-b border-slate-100 p-5 dark:border-surface-700"
      >
        <div class="flex items-center gap-3">
          <span
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-accent-50 text-accent-600 dark:bg-accent-900/20 dark:text-accent-400"
            aria-hidden="true"
          >
            <i class="fa-solid fa-user-plus"></i>
          </span>
          <h2
            id="purchase-supplier-title"
            class="font-heading text-xl font-black tracking-tight uppercase"
          >
            Nuevo proveedor
          </h2>
        </div>
        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-lg text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden dark:hover:bg-surface-700 dark:hover:text-slate-200"
          aria-label="Cerrar"
          (click)="dismiss.emit()"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </header>

      <form class="overflow-y-auto p-5" [formGroup]="form" (ngSubmit)="submit()">
        @if (error(); as message) {
          <p
            class="mb-3 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-bold text-red-600 dark:border-red-800 dark:bg-red-900/10 dark:text-red-400"
            role="alert"
          >
            {{ message }}
          </p>
        }

        <div class="grid gap-3">
          <div>
            <label
              for="purchase-supplier-name"
              class="text-[10px] font-bold tracking-widest text-slate-400 uppercase"
            >
              Nombre *
            </label>
            <input
              id="purchase-supplier-name"
              type="text"
              class="input mt-1 py-2.5 text-xs"
              placeholder="Ej: Distribuidora Central"
              formControlName="name"
            />
            @if (form.controls.name.invalid && form.controls.name.touched) {
              <p class="mt-1 text-xs font-bold text-red-600 dark:text-red-400">
                Indica el nombre (máx. 120 caracteres).
              </p>
            }
          </div>
          <div>
            <label
              for="purchase-supplier-ruc"
              class="text-[10px] font-bold tracking-widest text-slate-400 uppercase"
            >
              RUC
            </label>
            <input
              id="purchase-supplier-ruc"
              type="text"
              class="input mt-1 py-2.5 text-xs"
              formControlName="ruc"
            />
          </div>
          <div class="grid gap-3 sm:grid-cols-2">
            <div>
              <label
                for="purchase-supplier-phone"
                class="text-[10px] font-bold tracking-widest text-slate-400 uppercase"
              >
                Teléfono
              </label>
              <input
                id="purchase-supplier-phone"
                type="tel"
                class="input mt-1 py-2.5 text-xs"
                formControlName="phone"
              />
            </div>
            <div>
              <label
                for="purchase-supplier-email"
                class="text-[10px] font-bold tracking-widest text-slate-400 uppercase"
              >
                Correo
              </label>
              <input
                id="purchase-supplier-email"
                type="email"
                class="input mt-1 py-2.5 text-xs"
                formControlName="email"
              />
              @if (form.controls.email.invalid && form.controls.email.touched) {
                <p class="mt-1 text-xs font-bold text-red-600 dark:text-red-400">
                  Revisa el correo.
                </p>
              }
            </div>
          </div>
          <div>
            <label
              for="purchase-supplier-address"
              class="text-[10px] font-bold tracking-widest text-slate-400 uppercase"
            >
              Dirección
            </label>
            <input
              id="purchase-supplier-address"
              type="text"
              class="input mt-1 py-2.5 text-xs"
              formControlName="address"
            />
          </div>
        </div>
      </form>

      <footer
        class="flex items-center justify-end gap-2 border-t border-slate-100 p-4 dark:border-surface-700"
      >
        <button type="button" class="btn btn-ghost btn-sm" (click)="dismiss.emit()">
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary btn-sm"
          data-testid="purchase-supplier-save"
          (click)="submit()"
        >
          Guardar proveedor
        </button>
      </footer>
    </div>
  </div>
}

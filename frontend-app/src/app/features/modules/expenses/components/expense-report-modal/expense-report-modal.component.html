@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm"
    role="presentation"
    (click)="closed.emit()"
    (keydown.escape)="closed.emit()"
  >
    <div
      class="max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-3xl border border-slate-200 bg-white shadow-2xl dark:border-surface-700 dark:bg-surface-800"
      role="dialog"
      aria-modal="true"
      aria-labelledby="expense-report-title"
      (click)="$event.stopPropagation()"
      (keydown.escape)="closed.emit()"
    >
      <header
        class="flex items-start justify-between gap-4 border-b border-slate-100 px-6 py-5 dark:border-surface-700"
      >
        <div>
          <h2
            id="expense-report-title"
            class="font-heading text-xl font-black tracking-tight uppercase"
          >
            📊 Reporte de gastos
          </h2>
          <p class="mt-2 max-w-xl text-sm text-slate-500 dark:text-slate-400">
            Egresos por categoría, empleado y mes. Los cancelados no suman.
          </p>
        </div>
        <button
          type="button"
          class="rounded-lg p-2 text-slate-400 hover:bg-slate-100 dark:hover:bg-surface-700"
          aria-label="Cerrar"
          (click)="closed.emit()"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </header>

      <div class="flex flex-col gap-5 px-6 py-5">
        <div class="flex flex-col gap-1">
          <label
            for="report-period"
            class="text-xs font-semibold text-slate-600 dark:text-slate-300"
          >
            Período
          </label>
          <select id="report-period" class="input" [value]="period()" (change)="setPeriod($event)">
            @for (period of periods; track period.value) {
              <option [value]="period.value">{{ period.label }}</option>
            }
          </select>
        </div>

        <fieldset class="flex flex-col gap-2">
          <legend class="text-xs font-semibold text-slate-600 dark:text-slate-300">Estado</legend>
          <div class="flex flex-wrap gap-4">
            @for (option of statusFilters; track option.value) {
              <label class="flex items-center gap-2 text-sm">
                <input
                  type="radio"
                  name="report-status"
                  [value]="option.value"
                  [checked]="status() === option.value"
                  (change)="setStatus(option.value)"
                />
                {{ option.label }}
              </label>
            }
          </div>
        </fieldset>

        <fieldset class="flex flex-col gap-2">
          <legend class="text-xs font-semibold text-slate-600 dark:text-slate-300">Tipo</legend>
          <div class="flex flex-wrap gap-4">
            @for (option of typeFilters; track option.value) {
              <label class="flex items-center gap-2 text-sm">
                <input
                  type="radio"
                  name="report-type"
                  [value]="option.value"
                  [checked]="type() === option.value"
                  (change)="setType(option.value)"
                />
                {{ option.label }}
              </label>
            }
          </div>
        </fieldset>

        <div class="grid gap-4 sm:grid-cols-2">
          <div class="flex flex-col gap-1">
            <label
              for="report-category"
              class="text-xs font-semibold text-slate-600 dark:text-slate-300"
            >
              Categoría
            </label>
            <select
              id="report-category"
              class="input"
              [value]="category()"
              (change)="setCategory($event)"
            >
              <option value="all">Todas las categorías</option>
              @for (category of categories; track category.value) {
                <option [value]="category.value">{{ category.label }}</option>
              }
            </select>
          </div>
          <div class="flex flex-col gap-1">
            <label
              for="report-payment"
              class="text-xs font-semibold text-slate-600 dark:text-slate-300"
            >
              Forma de pago
            </label>
            <select
              id="report-payment"
              class="input"
              [value]="paymentMethod()"
              (change)="setPaymentMethod($event)"
            >
              <option value="all">Todas las formas de pago</option>
              @for (method of paymentMethods; track method.value) {
                <option [value]="method.value">{{ method.label }}</option>
              }
            </select>
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <label
            for="report-beneficiary"
            class="text-xs font-semibold text-slate-600 dark:text-slate-300"
          >
            Empleado / beneficiario
          </label>
          <input
            id="report-beneficiary"
            type="text"
            class="input"
            placeholder="Todos"
            [value]="beneficiary()"
            (input)="setBeneficiary($event)"
          />
        </div>

        <div class="rounded-2xl bg-slate-50 px-4 py-3 dark:bg-surface-900/60">
          <p class="text-sm font-bold">{{ filtered().length }} gastos</p>
          <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
            Total: {{ total() | appCurrency }}
          </p>
        </div>
      </div>

      <footer
        class="flex flex-wrap justify-end gap-3 border-t border-slate-100 px-6 py-4 dark:border-surface-700"
      >
        <button type="button" class="btn btn-secondary" (click)="closed.emit()">Cancelar</button>
        <button
          type="button"
          class="btn btn-primary"
          data-testid="report-excel"
          (click)="download('excel')"
        >
          <i class="fa-solid fa-file-excel text-xs" aria-hidden="true"></i>
          Excel
        </button>
        <button
          type="button"
          class="btn btn-primary"
          data-testid="report-pdf"
          (click)="download('pdf')"
        >
          <i class="fa-solid fa-file-pdf text-xs" aria-hidden="true"></i>
          PDF
        </button>
      </footer>
    </div>
  </div>
}

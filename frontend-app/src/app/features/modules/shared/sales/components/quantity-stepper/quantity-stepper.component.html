<div
  class="inline-flex items-center gap-1 rounded-xl border border-slate-200 p-1 dark:border-surface-600"
  role="group"
  [attr.aria-label]="'Cantidad de ' + label()"
  data-testid="quantity-stepper"
>
  <button
    type="button"
    class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-600 transition-colors hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden disabled:cursor-not-allowed disabled:opacity-40 dark:text-slate-300 dark:hover:bg-surface-700"
    [disabled]="value() <= min()"
    [attr.aria-label]="'Disminuir cantidad de ' + label()"
    data-testid="stepper-minus"
    (click)="decrement()"
  >
    <i class="fa-solid fa-minus text-xs" aria-hidden="true"></i>
  </button>
  <span
    class="w-8 text-center text-sm font-bold tabular-nums text-slate-900 dark:text-white"
    aria-live="polite"
    data-testid="stepper-value"
    >{{ value() }}</span
  >
  <button
    type="button"
    class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-600 transition-colors hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-hidden disabled:cursor-not-allowed disabled:opacity-40 dark:text-slate-300 dark:hover:bg-surface-700"
    [disabled]="value() >= max()"
    [attr.aria-label]="'Aumentar cantidad de ' + label()"
    data-testid="stepper-plus"
    (click)="increment()"
  >
    <i class="fa-solid fa-plus text-xs" aria-hidden="true"></i>
  </button>
</div>

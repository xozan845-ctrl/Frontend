@if (open()) {
  <div class="fixed inset-0 z-[70] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm" aria-hidden="true"></div>

    <div
      class="relative w-full max-w-md rounded-3xl border border-slate-200 bg-white p-5 shadow-2xl motion-safe:animate-scale-in dark:border-surface-700 dark:bg-surface-800"
      role="dialog"
      aria-modal="true"
      aria-labelledby="cash-method-title"
      tabindex="-1"
      [appFocusTrap]="open()"
      (escape)="dismiss.emit()"
      data-testid="cash-method-dialog"
    >
      <header class="mb-4 flex items-start justify-between gap-3">
        <h2
          id="cash-method-title"
          class="font-heading text-xl font-black tracking-tight text-slate-900 dark:text-white"
        >
          Nuevo método de pago
        </h2>
        <button
          type="button"
          class="btn btn-ghost btn-sm px-2.5 text-slate-400"
          aria-label="Cerrar"
          (click)="dismiss.emit()"
        >
          <i class="fa-solid fa-xmark text-base" aria-hidden="true"></i>
        </button>
      </header>

      <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
        <div class="flex flex-col gap-1.5">
          <label
            for="cash-method-name"
            class="text-xs font-bold text-slate-500 dark:text-slate-400"
          >
            Nombre *
          </label>
          <input
            id="cash-method-name"
            type="text"
            class="input py-3 text-sm"
            formControlName="name"
            placeholder="Ej: Transferencia BAC"
            data-testid="cash-method-name"
          />
          @if (isInvalid()) {
            <p class="text-xs font-bold text-red-600 dark:text-red-400">
              Indica el nombre del método.
            </p>
          }
        </div>

        <div class="flex flex-col gap-1.5">
          <label
            for="cash-method-kind"
            class="text-xs font-bold text-slate-500 dark:text-slate-400"
          >
            Tipo
          </label>
          <select id="cash-method-kind" class="input py-3 text-sm" formControlName="kind">
            @for (kind of kinds; track kind.value) {
              <option [value]="kind.value">{{ kind.label }}</option>
            }
          </select>
        </div>

        <footer class="flex items-center justify-end gap-2 pt-2">
          <button type="button" class="btn btn-ghost btn-sm" (click)="dismiss.emit()">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary btn-sm" data-testid="cash-method-save">
            <i class="fa-solid fa-check text-xs" aria-hidden="true"></i>
            Guardar método
          </button>
        </footer>
      </form>
    </div>
  </div>
}

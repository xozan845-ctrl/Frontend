@if (showBanner()) {
  <div
    class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 w-full md:w-auto"
    style="animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both"
    role="complementary"
    aria-label="Banner de instalación de aplicación"
  >
    <div
      class="bg-white dark:bg-surface-800 border border-slate-200 dark:border-surface-700 rounded-2xl shadow-2xl p-4 flex items-center gap-4 md:w-80"
    >
      <!-- App Icon -->
      <div
        class="w-12 h-12 bg-black dark:bg-white rounded-xl flex items-center justify-center shrink-0 shadow-md"
      >
        <i class="fa-solid fa-bolt text-white dark:text-black text-lg"></i>
      </div>

      <!-- Text -->
      <div class="flex-1 min-w-0">
        <p
          class="text-sm font-black uppercase tracking-tight text-slate-900 dark:text-white leading-tight"
        >
          Instalar Quantum
        </p>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium leading-tight mt-0.5">
          Acceso rápido desde tu pantalla de inicio
        </p>
      </div>

      <!-- Actions -->
      <div class="flex gap-2 shrink-0">
        <button
          (click)="install()"
          class="bg-accent-600 hover:bg-accent-700 text-white text-xs font-bold uppercase tracking-widest px-4 py-2 rounded-lg shadow-md hover:shadow-lg active:scale-95 transition-all"
          aria-label="Instalar aplicación"
        >
          Instalar
        </button>
        <button
          (click)="dismiss()"
          class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-surface-700 active:scale-90 transition-all"
          aria-label="Cerrar banner"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
  </div>
}

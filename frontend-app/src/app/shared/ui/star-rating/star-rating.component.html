<div
  class="flex items-center gap-1"
  role="group"
  [attr.aria-label]="'Calificación: ' + value() + ' de 5 estrellas'"
>
  @for (i of starsArray; track i) {
    @if (interactive()) {
      <button
        type="button"
        (click)="onSelect(i)"
        (mouseenter)="hoveredRating.set(i)"
        (mouseleave)="hoveredRating.set(0)"
        [attr.aria-label]="'Dar ' + i + ' estrella' + (i > 1 ? 's' : '')"
        class="focus:outline-hidden focus:ring-2 focus:ring-accent-600 dark:focus:ring-accent-500 rounded-sm transition-transform hover:scale-125 cursor-pointer leading-none"
      >
        <i
          class="fa-star leading-none"
          [class.fa-solid]="displayRating() >= i"
          [class.fa-regular]="displayRating() < i"
          [class.text-amber-400]="displayRating() >= i"
          [class.text-slate-300]="displayRating() < i"
          [class.dark:text-surface-600]="displayRating() < i"
          [class.text-sm]="size() === 'sm'"
          [class.text-base]="size() === 'md'"
          [class.text-xl]="size() === 'lg'"
        ></i>
      </button>
    } @else {
      <i
        class="fa-star leading-none"
        [class.fa-solid]="value() >= i"
        [class.fa-regular]="value() < i"
        [class.text-amber-400]="value() >= i"
        [class.text-slate-300]="value() < i"
        [class.dark:text-surface-600]="value() < i"
        [class.text-sm]="size() === 'sm'"
        [class.text-base]="size() === 'md'"
        [class.text-xl]="size() === 'lg'"
      ></i>
    }
  }
  @if (showCount() && reviewCount() > 0) {
    <span
      class="ml-1 font-medium text-slate-500 dark:text-slate-400"
      [class.text-xs]="size() === 'sm' || size() === 'md'"
      [class.text-sm]="size() === 'lg'"
    >
      ({{ reviewCount() }})
    </span>
  }
</div>

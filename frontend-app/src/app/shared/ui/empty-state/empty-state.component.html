<div class="flex flex-col items-center justify-center py-20 px-6 text-center">
  <!-- Illustrated Icon -->
  <div class="relative mb-8">
    @if (variant() === 'loading') {
      <app-spinner size="xl" />
    } @else {
      <div
        class="w-28 h-28 rounded-full flex items-center justify-center shadow-inner"
        [class]="iconContainerClasses()"
      >
        <i [class]="icon() + ' text-5xl ' + iconClasses()"></i>
      </div>
      <!-- Decorative dots for non-loading variants -->
      @if (variant() !== 'loading') {
        <div class="absolute -top-2 -right-2 w-5 h-5 rounded-full" [class]="dot1Class()"></div>
        <div class="absolute -bottom-1 -left-3 w-3 h-3 rounded-full" [class]="dot2Class()"></div>
      }
    }
  </div>

  <h3 class="text-xl font-black uppercase tracking-widest mb-3" [class]="titleClasses()">
    {{ title() }}
  </h3>

  <p class="text-sm font-medium max-w-xs leading-relaxed mb-8" [class]="subtitleClasses()">
    {{ subtitle() }}
  </p>

  @if (actionLabel() && actionRoute()) {
    <a
      [routerLink]="actionRoute()"
      class="inline-flex items-center gap-2 text-white font-bold uppercase tracking-widest text-xs px-8 py-4 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all"
      [class]="actionButtonClasses()"
    >
      {{ actionLabel() }}
      <i class="fa-solid fa-arrow-right"></i>
    </a>
  }
  @if (actionLabel() && !actionRoute() && actionClick()) {
    <button
      (click)="actionClick()!()"
      class="inline-flex items-center gap-2 text-white font-bold uppercase tracking-widest text-xs px-8 py-4 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all"
      [class]="actionButtonClasses()"
    >
      {{ actionLabel() }}
    </button>
  }
</div>

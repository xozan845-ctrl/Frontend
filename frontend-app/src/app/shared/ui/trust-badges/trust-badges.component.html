<div
  [class]="
    compact()
      ? 'grid grid-cols-2 gap-3 border-t border-slate-100 pt-6 dark:border-surface-700'
      : 'grid grid-cols-2 gap-4 border-t border-slate-100 pt-8 lg:grid-cols-4 dark:border-surface-700'
  "
>
  @for (badge of badges(); track badge.title) {
    <div class="flex flex-col items-center gap-2 text-center">
      <i
        [class]="badge.icon"
        class="mb-1 text-slate-300 dark:text-surface-600"
        [class.text-xl]="compact()"
        [class.text-2xl]="!compact()"
        aria-hidden="true"
      ></i>
      <span class="text-[9px] font-bold tracking-widest text-slate-500 uppercase">
        {{ badge.title }}
      </span>
      @if (!compact() && badge.subtitle) {
        <span class="text-[10px] font-medium text-slate-400 dark:text-slate-500">
          {{ badge.subtitle }}
        </span>
      }
    </div>
  }
</div>

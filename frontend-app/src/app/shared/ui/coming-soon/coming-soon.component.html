<section class="animate-slide-up motion-reduce:animate-none" data-testid="coming-soon">
  <header class="mb-6 flex flex-wrap items-center gap-3">
    <h1
      class="font-heading text-2xl font-black tracking-tight text-slate-900 sm:text-3xl dark:text-white"
    >
      {{ title() }}
    </h1>
    <span
      class="badge badge-warning inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-[10px] font-black tracking-widest uppercase"
    >
      <i class="fa-solid fa-hammer" aria-hidden="true"></i>
      En construcción
    </span>
  </header>

  <app-empty-state
    variant="empty"
    [icon]="icon()"
    title="Estamos trabajando en esta sección"
    [subtitle]="description()"
  />
</section>

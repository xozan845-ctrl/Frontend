<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- CSP estricta (R-SE-9). El hash sha256 autoriza el único script inline
         que genera Angular (el "swap" de CSS crítico de Beasties:
         link[data-beasties-media].media = 'all'). Si al actualizar Angular
         cambia ese snippet, los estilos dejarán de aplicarse; recalcula el hash
         con el error de la consola del navegador o con el comando documentado en
         docs/firebase-hosting-setup.md (§3). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://images.unsplash.com https://*.unsplash.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://api.kbcoleccion.com http://localhost:8080 http://localhost:3000; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Quantum Store — Hardware Premium</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0055ff" />
    <meta
      name="description"
      content="Selección editorial de tecnología de alto rendimiento. Hardware sin concesiones para profesionales exigentes."
    />
    <!-- Open Graph/Twitter por defecto; el SeoService los sobrescribe por página. -->
    <meta property="og:site_name" content="Quantum Store" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quantum Store — Hardware Premium" />
    <meta
      property="og:description"
      content="Selección editorial de tecnología de alto rendimiento. Hardware sin concesiones para profesionales exigentes."
    />
    <!-- Las URLs sociales deben ser absolutas: WhatsApp no resuelve rutas
         relativas. Si cambia el dominio del frontend, actualiza estos valores
         (también `scripts/commands/generate-invitation-html.mjs`). -->
    <meta
      property="og:image"
      content="https://kb-coleccion-internacional-ni.web.app/og-image.png"
    />
    <meta property="og:image:alt" content="Quantum Store — Hardware Premium" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quantum Store — Hardware Premium" />
    <meta
      name="twitter:description"
      content="Selección editorial de tecnología de alto rendimiento. Hardware sin concesiones para profesionales exigentes."
    />
    <meta
      name="twitter:image"
      content="https://kb-coleccion-internacional-ni.web.app/og-image.png"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
